name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.0"
  NDK_VERSION: "29.0.14206865"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          v="$(sed -n 's/^procraft\.version=//p' android/gradle.properties)"
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: apk-only

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version "^4" --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.PROCRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "PROCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"
          else
            echo "::warning::No release key: signed with the debug key"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: android
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PROCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PROCRAFT_KEYSTORE_PASSWORD }}
          PROCRAFT_KEY_ALIAS: ${{ secrets.PROCRAFT_KEY_ALIAS }}
          PROCRAFT_KEY_PASSWORD: ${{ secrets.PROCRAFT_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease -Pprocraft.abis=arm64-v8a -Pprocraft.version=$VERSION
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/procraft-$VERSION-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: procraft-apk
          path: dist/*
          if-no-files-found: error

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
